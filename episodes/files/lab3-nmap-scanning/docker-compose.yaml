# Lab 3: Nmap Port & Service Scanning (Phase 2 — Scanning & Enumeration)
# Lab focus: port scanning, service/version detection, OS fingerprinting, NSE scripts

services:

  lab3-attacker:
    image: ethical-base
    container_name: lab3-attacker
    hostname: kali-attacker
    stdin_open: true
    tty: true
    user: root
    networks:
      lab3-net:
        ipv4_address: 10.10.3.2
    cap_add:
      - NET_ADMIN
      - NET_RAW
    command: >
      /bin/bash -c "
      echo '======================================================' &&
      echo ' Lab 3 Attacker Ready' &&
      echo ' Targets on 10.10.3.0/24:' &&
      echo '   10.10.3.10  lab3-web  (HTTP/Nginx)' &&
      echo '   10.10.3.11  lab3-ftp  (FTP/vsftpd)' &&
      echo '   10.10.3.12  lab3-ssh  (SSH/OpenSSH)' &&
      echo ' Enter: docker exec -it lab3-attacker bash' &&
      echo '======================================================' &&
      tail -f /dev/null"

  lab3-web:
    image: nginx:alpine
    container_name: lab3-web
    hostname: web-server
    networks:
      lab3-net:
        ipv4_address: 10.10.3.10
    volumes:
      - ./web-content:/usr/share/nginx/html:ro
    restart: unless-stopped

  lab3-ftp:
    image: ubuntu:22.04
    container_name: lab3-ftp
    hostname: ftp-server
    environment:
      - DEBIAN_FRONTEND=noninteractive
    networks:
      lab3-net:
        ipv4_address: 10.10.3.11
    command: >
      /bin/bash -c "
      apt-get update -qq &&
      apt-get install -y -q vsftpd &&
      mkdir -p /var/ftp/pub/.backup /var/run/vsftpd/empty &&
      echo 'CyberCorp Internal Repository - Authorised access only.' > /var/ftp/pub/README.txt &&
      echo 'flag{lab3_anon_ftp_reader}' > /var/ftp/pub/user.txt &&
      echo 'flag{lab3_hidden_dir_enumeration}' > /var/ftp/pub/.backup/root.txt &&
      echo 'anonymous_enable=YES' > /etc/vsftpd.conf &&
      echo 'local_enable=NO' >> /etc/vsftpd.conf &&
      echo 'write_enable=NO' >> /etc/vsftpd.conf &&
      echo 'dirmessage_enable=YES' >> /etc/vsftpd.conf &&
      echo 'listen=YES' >> /etc/vsftpd.conf &&
      echo 'listen_ipv6=NO' >> /etc/vsftpd.conf &&
      echo 'anon_root=/var/ftp' >> /etc/vsftpd.conf &&
      echo 'secure_chroot_dir=/var/run/vsftpd/empty' >> /etc/vsftpd.conf &&
      echo 'seccomp_sandbox=NO' >> /etc/vsftpd.conf &&
      echo 'ftpd_banner=CyberCorp FTP Server v3.0.5 Authorised Users Only' >> /etc/vsftpd.conf &&
      vsftpd /etc/vsftpd.conf"
    restart: unless-stopped

  lab3-ssh:
    image: ubuntu:22.04
    container_name: lab3-ssh
    hostname: ssh-server
    environment:
      - DEBIAN_FRONTEND=noninteractive
    networks:
      lab3-net:
        ipv4_address: 10.10.3.12
    command: >
      /bin/bash -c "
      apt-get update -qq &&
      apt-get install -y -q openssh-server &&
      mkdir -p /var/run/sshd &&
      ssh-keygen -A &&
      useradd -m -s /bin/bash sysadmin &&
      echo 'sysadmin:ChangeMe2024!' | chpasswd &&
      sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config &&
      sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config &&
      echo 'Banner /etc/ssh/banner' >> /etc/ssh/sshd_config &&
      printf '**********************************************\n* CyberCorp Remote Management System v2.1   *\n* Authorised access only. Connections logged.*\n**********************************************\n' > /etc/ssh/banner &&
      /usr/sbin/sshd -D"
    restart: unless-stopped

networks:
  lab3-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.3.0/24
